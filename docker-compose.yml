version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: smartledger
      POSTGRES_PASSWORD: smartledger123
      POSTGRES_DB: smartledger
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-database.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"

  app:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://smartledger:smartledger123@db:5432/smartledger
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - SECRET_KEY=your-secret-key
      - DEBUG=true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      - app
    ports:
      - "8080:80"

  web:
    build: ./frontend
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
    container_name: smartledger-web

volumes:
  postgres_data:
  redis_data:
  minio_data:
